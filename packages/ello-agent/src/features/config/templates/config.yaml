# 已命名模型目录。每项都包含完整协议、连接和调用限制。
models:
  openai-gpt-5.5:
    protocol: openai
    endpoint: responses
    api_model: gpt-5.5
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    context_window: 400000
    max_output_tokens: 32000
    reasoning_effort: high
  openai-gpt-5.4:
    protocol: openai
    endpoint: responses
    api_model: gpt-5.4
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    context_window: 400000
    max_output_tokens: 16000
    reasoning_effort: low

# Agent definition 只能选择这两个全局引用字段，不能直接绑定模型名称。
primary_model: openai-gpt-5.5
auxiliary_model: openai-gpt-5.4

# 默认工作目录；通常不要写死，命令行 --cwd 会覆盖。
# cwd: /path/to/project

# 会话保存目录；留空时使用 ~/.ello/sessions。
# session_dir: ~/.ello/sessions

# 新会话初始模式。可选 ask-before-changes、plan、accept-edits、bypass。
initial_mode: ask-before-changes
# bypass 必须同时由这个安全开关显式启用。
bypass_enabled: false

# false 时直接使用第一条用户消息作为 Thread 标题；true 时使用 title Agent 的辅助模型生成。
title_generation: false

# 允许工具访问的路径根目录；默认至少包含当前 cwd。
# allowed_paths:
#   - /path/to/project

# 子 Agent 能力开关。false 时不注册 delegate_to_subagent / task_output / task_stop 三个
# 工具，也不注入 Delegation 提示词段落。cwd_policy 控制 child 工作目录范围。
# subagents:
#   enabled: true
#   cwd_policy: allowed_paths

# 细粒度权限规则；通常由权限命令或 TUI 写入，不建议手写复杂规则。
# permission_rules: []

# MCP 配置文件路径；默认使用 ~/.ello/mcp.json。
# mcp_config_path: ~/.ello/mcp.json

# context pipeline 配置。
# 运行期信息会作为可观测 source 注入 system，而不是拼在 base prompt 尾部。
# context:
#   max_input_tokens: 1000000
#   show_sources_in_tui: true
#   prompt_mode: rapid
#   instructions:
#     global:
#       - ~/.ello/ELLO.md
#     project:
#       - AGENTS.md
#       - .ello/ELLO.md
#       - .ello/instructions.md
#     extra:
#       - docs/**/*.agent.md
#       - https://example.com/team-agent-rules.md
#     nearby: true
#   compaction:
#     auto: true
#     tail_turns: 2
#     preserve_recent_tokens: 20000
#     threshold_percent: 90
#     prune_tool_output: false
#     tool_output_max_chars: 2000
#   memory:
#     enabled: false
#     private_dir: ~/.ello/memory/private
#     team_dir: .ello/memory/team
#     extraction:
#       enabled: true
#       recent_messages: 40
#       max_attempts: 2

# 默认启用交互式 TUI；命令行 --no-tui 可临时关闭。
# tui: true

# Goal 自动续跑的 host 上限。达到后目标暂停，不会伪装成完成。
# goal:
#   max_continuations: 20

# Langfuse 链路追踪默认关闭。关闭时无需配置 URL 或密钥；开启后密钥从
# LANGFUSE_PUBLIC_KEY 和 LANGFUSE_SECRET_KEY 环境变量读取。
# observability:
#   langfuse:
#     enabled: false
#
# 启用时必须提供完整连接配置：
# observability:
#   langfuse:
#     enabled: true
#     base_url: http://localhost:3000
#     environment: development
#     release: ello-ts-local
#     content: metadata # metadata 或 full

# Command 配置。disabled 表示完全不注册；need_approval 在 Default/Accept edits 下要求审批，
# 但 Accept edits 会自动放行 edit 类工具，Bypass 会跳过全部审批。
# 模型只看见 command_run；非核心能力始终通过内部 command_search/command_invoke Command
# 发现和调用。search 控制目录查询的结果数量与字节上限。
# commands:
#   disabled: []
#   need_approval:
#     - bash
#     - web_fetch
#   search:
#     result_limit: 6
#     max_result_bytes: 24000

# 工具长输出策略；超过阈值时模型只收到 preview，完整内容写入 session artifact。
# tool_output:
#   max_bytes: 12000
#   max_lines: 400
#   preview_lines: 120

# 额外 HTTP headers 直接写在对应 model 的 http_headers 字段中。

# 项目信任配置；路径可以直接作为 YAML key。
# projects:
#   /path/to/project:
#     trust_level: trusted

# workspace 挂载根目录；默认使用 ~/.ello。
# 活动 workspace 位于 <mount>/workspace，归档 workspace 位于 <mount>/archive。
# workspace:
#   mount: ~/.ello
